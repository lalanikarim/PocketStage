[package]
name = "pocketstage-server"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "HTTP control plane: REST project CRUD + (later) WS state snapshots. Embedded in / run beside the engine; never an audio path."

[dependencies]
axum = "0.8"
pocketstage-model = { path = "../pocketstage-model" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "test-util"] }
