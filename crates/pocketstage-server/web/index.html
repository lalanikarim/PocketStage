<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" width=device-width,initial-scale=1>
<title>PocketStage</title>
<style>
  :root { --bg:#111417; --card:#1b1f24; --ink:#e6e9ec; --dim:#8a939d;
          --acc:#3ddc84; --rec:#ff5b5b; --play:#4da3ff; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.4 system-ui,sans-serif; background:var(--bg); color:var(--ink); }
  header { display:flex; align-items:center; gap:10px; padding:14px 18px; }
  h1 { font-size:17px; margin:0; letter-spacing:.06em; text-transform:uppercase; }
  .dot { width:10px; height:10px; border-radius:50%; background:#555; }
  .dot.on { background:var(--acc); }
  main { padding:0 18px 28px; display:grid; gap:14px; max-width:760px; }
  .card { background:var(--card); border-radius:10px; padding:14px 16px; }
  h2 { font-size:12px; margin:0 0 10px; color:var(--dim); text-transform:uppercase; letter-spacing:.08em; }
  #transport { font-size:26px; font-weight:700; margin-bottom:8px; }
  #transport.playing { color:var(--play); } #transport.recording { color:var(--rec); }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(90px,1fr)); gap:8px; }
  .cell b { display:block; font-size:19px; }
  .cell span { color:var(--dim); font-size:11px; text-transform:uppercase; }
  .mrow { display:grid; grid-template-columns:90px 34px 1fr 46px 1fr 46px; gap:8px;
          align-items:center; padding:5px 0; }
  .mrow.muted .tname { color:var(--dim); text-decoration:line-through; }
  .mrow input[type=range] { padding:0; width:100%; }
  .mval { font-size:11px; color:var(--dim); text-align:right; }
  .chip { display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:5px; }
  ul { list-style:none; margin:0; padding:0; }
  li { display:flex; justify-content:space-between; padding:6px 2px; border-bottom:1px solid #2a2f35; }
  li:last-child { border:0; }
  label { display:block; color:var(--dim); font-size:11px; text-transform:uppercase; margin-top:8px; }
  input, textarea { width:100%; background:#0d1013; color:var(--ink); border:1px solid #2c3238;
                    border-radius:6px; padding:7px 9px; font:inherit; }
  textarea { min-height:200px; font:12px/1.45 ui-monospace,monospace; margin-top:8px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; }
  .row > div { flex:1; min-width:110px; }
  button { background:var(--acc); color:#0b0d0f; border:0; border-radius:6px;
           padding:9px 18px; font-weight:700; cursor:pointer; margin-top:12px; }
  button.alt { background:#2c3238; color:var(--ink); font-weight:400; }
  #msg { margin-top:8px; min-height:18px; font-size:12px; color:var(--dim); }
  #msg.err { color:var(--rec); }
  #remote button.rec { color:var(--rec); }
  #matrix { overflow-x:auto; }
  .mxrow { display:flex; gap:4px; align-items:center; margin-bottom:4px; }
  .mxname { width:120px; font-size:12px; color:var(--dim); overflow:hidden;
            white-space:nowrap; text-overflow:ellipsis; }
  .mxhead { width:34px; text-align:center; font-size:11px; color:var(--dim); }
  .mxcell { width:34px; height:26px; border:1px solid #333; border-radius:4px;
            background:#1c1c1c; cursor:pointer; font-size:10px; color:#666;
            display:flex; align-items:center; justify-content:center; }
  .mxcell.on { background:var(--acc); border-color:var(--acc); color:#04220f;
               font-weight:700; }
  .mxcell.sel { outline:2px solid var(--play); }
  .mxhead.hot { color:var(--play); font-weight:700; }
  .mxcell.hot { border-color:var(--play); }
  #remote button.hot { border-color:var(--play); color:var(--play); }
  #stepedit { margin-top:14px; border-top:1px solid #2a2a2a; padding-top:10px; }
  #stepedit .sgrid { display:grid; grid-template-columns:repeat(16, 30px);
                     gap:3px; margin-top:8px; }
  .step { height:32px; border:1px solid #333; border-radius:4px;
          background:#1c1c1c; color:#9cf; font-size:10px; cursor:pointer;
          display:flex; align-items:center; justify-content:center; }
  .step.on { background:#2b4a6f; border-color:#3d6da8; }
  .step.b0 { border-left-width:3px; border-left-color:#555; }
</style>
</head>
<body>
<header><h1>PocketStage</h1><span class="dot" id="conn"></span></header>
<main>
  <section class="card">
    <div id="transport">—</div>
    <div class="grid">
      <div class="cell"><b id="l-bpm">–</b><span>bpm</span></div>
      <div class="cell"><b id="l-pos">–</b><span>bar : beat</span></div>
      <div class="cell"><b id="l-scene">–</b><span>scene</span></div>
      <div class="cell"><b id="l-mode">–</b><span>mode</span></div>
      <div class="cell"><b id="l-takes">–</b><span>takes</span></div>
    </div>
    <div id="remote" style="margin-top:12px; display:flex; gap:6px; flex-wrap:wrap">
      <button data-cmd="transport/play" title="play (⌘ transport)">▶</button>
      <button data-cmd="transport/stop" title="stop">⏹</button>
      <button data-cmd="transport/record" class="rec" title="record">
        ⏺</button>
      <span style="width:10px"></span>
      <button data-cmd="scene/1">S1</button><button data-cmd="scene/2">S2</button>
      <button data-cmd="scene/3">S3</button><button data-cmd="scene/4">S4</button>
      <button data-cmd="scene/5">S5</button><button data-cmd="scene/6">S6</button>
      <button data-cmd="scene/7">S7</button><button data-cmd="scene/8">S8</button>
    </div>
  </section>

  <section class="card">
    <h2>Mixer</h2>
    <div id="mixer"><em>No tracks.</em></div>
  </section>

  <section class="card">
    <h2>Drum kit <span style="font-weight:normal;color:var(--dim)">(PRESET pads 1–8)</span>
      <button id="kit-reset" class="alt" style="float:right;font-size:11px">use default</button></h2>
    <div id="drumkit" style="display:flex;gap:8px;flex-wrap:wrap"></div>
  </section>

  <section class="card" id="projcard" hidden>
    <h2>Projects</h2>
    <div id="projects" style="display:flex;gap:6px;align-items:center;flex-wrap:wrap"></div>
  </section>

  <section class="card">
    <h2>Structure</h2>
    <div id="structure"></div>
  </section>

  <section class="card">
    <h2>Clip matrix</h2>
    <div id="matrix"><em>No tracks.</em></div>
    <div id="stepedit" hidden></div>
  </section>

  <section class="card">
    <h2>Recorded takes
      <button id="cleartakes" class="alt" style="float:right;font-size:11px"
              title="delete every take from the project">clear all</button>
    </h2>
    <ul id="takes"><li><em>none yet</em></li></ul>
  </section>

  <section class="card">
    <h2>Project</h2>
    <label>name</label><input id="p-name">
    <div class="row">
      <div><label>bpm</label><input id="p-bpm" type="number" step="0.1" min="20" max="300"></div>
      <div><label>loop bars</label><input id="p-loop" type="number" step="1" min="1" max="64"></div>
    </div>
    <button id="save">Save</button>
    <button id="toggle" class="alt" type="button">raw JSON ▸</button>
    <textarea id="raw" hidden spellcheck="false"></textarea>
    <div id="msg"></div>
  </section>
</main>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
let project = null;          // last ProjectFile fetched from the server
let liveTakes = -1;          // take count seen in the latest WS frame (array)
let lastTransport = "stopped";

// Highlight the active scene column (matrix + chips) from WS state.
function hlScene(n) {
  document.querySelectorAll(".hot").forEach((e) => e.classList.remove("hot"));
  if (!n) return;
  const si = n - 1;
  document.querySelectorAll(`.mxhead[data-si="${si}"], .mxcell[data-si="${si}"]`)
    .forEach((e) => e.classList.add("hot"));
  const chip = document.querySelector(`#remote button[data-cmd="scene/${n}"]`);
  if (chip) chip.classList.add("hot");
}
let dirty = false;           // local edits not yet PUT to the store

function setSave() { $("save").textContent = dirty ? "Save ●" : "Save"; }
function markDirty() { dirty = true; setSave(); }

function msg(text, isErr) {
  const el = $("msg");
  el.textContent = text || "";
  el.className = isErr ? "err" : "";
}

function renderMixer(pf) {
  const box = $("mixer");
  box.innerHTML = "";
  const tracks = pf.project.tracks || [];
  if (!tracks.length) box.innerHTML = "<em>No tracks.</em>";
  for (const t of tracks) {
    const row = document.createElement("div");
    row.className = "mrow" + (t.mute ? " muted" : "");

    const name = document.createElement("span");
    name.className = "tname";
    const chip = document.createElement("span");
    chip.className = "chip";
    chip.style.background = `rgb(${(t.color || [200, 200, 200]).join(",")})`;
    name.append(chip, document.createTextNode(t.name));

    const mute = document.createElement("input");
    mute.type = "checkbox"; mute.checked = !!t.mute; mute.title = "mute";

    const gain = document.createElement("input");
    gain.type = "range"; gain.min = 0; gain.max = 2; gain.step = 0.01;
    gain.value = t.gain ?? 1; gain.title = "gain 0..2";
    const gval = document.createElement("span"); gval.className = "mval";

    const pan = document.createElement("input");
    pan.type = "range"; pan.min = -1; pan.max = 1; pan.step = 0.05;
    pan.value = t.pan ?? 0; pan.title = "pan L..R";
    const pval = document.createElement("span"); pval.className = "mval";

    // FX sends: 0..1 sliders (CC91/CC93 in the engine). Empty default =
    // soundfont value; slider position 0 doubles as "off" once touched.
    const mkSend = (key, title) => {
      const s = document.createElement("input");
      s.type = "range"; s.min = 0; s.max = 1; s.step = 0.01;
      s.value = t[key] ?? 0; s.title = title;
      s.style.width = "70px";
      const v = document.createElement("span"); v.className = "mval";
      const upd = () => { v.textContent = title.split(" ")[0] + " " + (+s.value).toFixed(2); };
      upd();
      s.addEventListener("input", () => { t[key] = +s.value; markDirty(); upd(); });
      return [s, v];
    };
    const [rev, revv] = mkSend("reverb", "rev send");
    const [cho, chov] = mkSend("chorus", "cho send");

    const labels = () => {
      gval.textContent = (+gain.value).toFixed(2);
      pval.textContent = (+pan.value).toFixed(2);
    };
    labels();

    gain.addEventListener("input", () => { t.gain = +gain.value; markDirty(); labels(); });
    pan.addEventListener("input", () => { t.pan = +pan.value; markDirty(); labels(); });
    mute.addEventListener("input", () => {
      t.mute = mute.checked; row.classList.toggle("muted", mute.checked);
      markDirty();
    });

    row.append(name, mute, gain, gval, pan, pval, rev, revv, cho, chov);
    box.appendChild(row);
  }

  // Global FX amounts (project-level): scale the master reverb/chorus.
  // None = engine default (0.9 / 0.5) — shown as such until touched.
  const grow = document.createElement("div");
  grow.className = "mrow";
  const gname = document.createElement("span");
  gname.className = "tname";
  gname.textContent = "Global FX";
  const mkGlobal = (key, dflt, title) => {
    const s = document.createElement("input");
    s.type = "range"; s.min = 0; s.max = 1; s.step = 0.01;
    s.value = pf.project[key] ?? dflt; s.title = title + ` (default ${dflt})`;
    const v = document.createElement("span"); v.className = "mval";
    const upd = () => {
      v.textContent = title + " " + (+s.value).toFixed(2)
        + (pf.project[key] == null && +s.value === dflt ? " (dflt)" : "");
    };
    upd();
    s.addEventListener("input", () => { pf.project[key] = +s.value; markDirty(); upd(); });
    return [s, v];
  };
  const [grev, grevv] = mkGlobal("fx_reverb", 0.9, "rev");
  const [gcho, gchov] = mkGlobal("fx_chorus", 0.5, "cho");
  grow.append(gname, grev, grevv, gcho, gchov);
  box.appendChild(grow);
}

function renderProject(pf) {
  project = pf;
  $("p-name").value = pf.project.name;
  $("p-bpm").value = pf.project.bpm;
  $("p-loop").value = pf.project.loop_bars;
  renderMixer(pf);
  renderMatrix();
  renderStructure();
  renderKit();
  if (!$("raw").hidden) $("raw").value = JSON.stringify(pf, null, 2);
  const ul = $("takes");
  ul.innerHTML = "";
  const takes = pf.project.takes || [];
  if (!takes.length) { ul.innerHTML = "<li><em>none yet</em></li>"; return; }
  for (const t of takes) {
    const li = document.createElement("li");

    const label = document.createElement("span");
    label.textContent = t.name + (t.muted ? " (muted)" : "");
    if (t.muted) label.style.color = "var(--dim)";

    const mute = document.createElement("input");
    mute.type = "checkbox"; mute.checked = !!t.muted; mute.title = "mute take";
    mute.style.marginRight = "8px";
    mute.addEventListener("input", () => {
      t.muted = mute.checked; markDirty();
      label.textContent = t.name + (t.muted ? " (muted)" : "");
      label.style.color = t.muted ? "var(--dim)" : "";
    });

    // Solo: audition this take alone using the existing mute flags —
    // immediate PUT so playback changes right away. Toggle back solos all.
    const others = project.project.takes.filter((x) => x.name !== t.name);
    const isSolo = !t.muted && others.every((x) => x.muted);
    const solo = document.createElement("button");
    solo.className = "alt"; solo.textContent = "S"; solo.title = "solo (audition alone)";
    solo.style.margin = "0 0 0 8px"; solo.style.padding = "2px 9px";
    if (isSolo) { solo.style.borderColor = "var(--acc)"; solo.style.color = "var(--acc)"; }
    solo.addEventListener("click", async () => {
      const body = structuredClone(project);
      for (const x of body.project.takes) x.muted = isSolo ? false : (x.name !== t.name);
      await putProject(body, isSolo ? "unsoloed" : `soloed ${t.name}`);
    });

    const ren = document.createElement("button");
    ren.className = "alt"; ren.textContent = "\u270E"; ren.title = "rename take";
    ren.style.margin = "0 0 0 8px"; ren.style.padding = "2px 9px";
    ren.addEventListener("click", async () => {
      const to = prompt("New name for " + t.name + ":", t.name);
      if (!to || to.trim() === t.name) return;
      const r = await fetch("/api/takes/rename", { method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ from: t.name, to: to.trim() }) });
      if (!r.ok) { msg("rename rejected: " + (await r.text()), true); return; }
      dirty = false; setSave();
      await refresh();
    });

    const del = document.createElement("button");
    del.className = "alt"; del.textContent = "\u2715"; del.title = "delete take";
    del.style.margin = "0 0 0 8px"; del.style.padding = "2px 9px";
    del.addEventListener("click", async () => {
      if (!confirm(`Delete ${t.name}? This cannot be undone.`)) return;
      const body = structuredClone(project);
      body.project.takes = body.project.takes.filter((x) => x.name !== t.name);
      await putProject(body, "take deleted");
    });

    const count = document.createElement("span");
    count.textContent = `${t.events.length} events`;

    const left = document.createElement("span");
    left.append(mute, label);
    li.append(left, count, solo, ren, del);
    li.style.display = "flex"; li.style.alignItems = "center";
    li.style.justifyContent = "space-between";
    ul.appendChild(li);
  }
}

async function putProject(body, okMsg) {
  try {
    const r = await fetch("/api/project", { method: "PUT",
      headers: {"Content-Type": "application/json"}, body: JSON.stringify(body) });
    if (!r.ok) { msg("rejected: " + (await r.text()), true); return; }
    dirty = false; setSave();
    msg(okMsg);
    refresh();
  } catch (e) { msg("save failed: " + e, true); }
}

async function refresh() {
  if (dirty) return; // never clobber unsaved local edits with a background fetch
  try {
    const r = await fetch("/api/project");
    renderProject(await r.json());
    msg("");
  } catch (e) { msg("project fetch failed: " + e, true); }
}

async function save() {
  if (!project) return;
  let body;
  if (!$("raw").hidden) {
    try { body = JSON.parse($("raw").value); }
    catch (e) { msg("raw JSON does not parse: " + e, true); return; }
  } else {
    body = structuredClone(project);
    body.project.name = $("p-name").value.trim() || "Untitled";
    body.project.bpm = parseFloat($("p-bpm").value);
    body.project.loop_bars = parseInt($("p-loop").value, 10);
  }
  await putProject(body, "saved — engine applies at next safe point");
}

function connect() {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  const ws = new WebSocket(`${proto}://${location.host}/ws`);
  ws.onopen = () => $("conn").classList.add("on");
  ws.onclose = () => { $("conn").classList.remove("on"); setTimeout(connect, 1000); };
  ws.onmessage = (ev) => {
    const f = JSON.parse(ev.data);
    if (f.type !== "status") return;
    const t = $("transport");
    t.textContent = f.transport.toUpperCase();
    t.className = f.transport;
    $("l-bpm").textContent = f.bpm;
    $("l-pos").textContent = f.bar + " : " + f.beat;
    $("l-scene").textContent = f.scene || "–";
    $("l-mode").textContent = f.mode;
    lastTransport = f.transport;
    hlScene(f.scene);
    const n = Array.isArray(f.takes) ? f.takes.length : 0;
    $("l-takes").textContent = n;
    if (n !== liveTakes) { liveTakes = n; refresh(); } // new take -> re-fetch list
  };
}

$("p-name").addEventListener("input", markDirty);
$("p-bpm").addEventListener("input", markDirty);
$("p-loop").addEventListener("input", markDirty);
$("save").addEventListener("click", save);
$("toggle").addEventListener("click", () => {
  const raw = $("raw");
  raw.hidden = !raw.hidden;
  if (!raw.hidden && project) raw.value = JSON.stringify(project, null, 2);
});
// Unsaved edits: warn before the tab closes.
window.addEventListener("beforeunload", (e) => {
  if (dirty) { e.preventDefault(); e.returnValue = ""; }
});

// Keyboard transport: Space = play/stop toggle, R = record. Ignored while
// typing in form fields.
window.addEventListener("keydown", async (e) => {
  const tag = document.activeElement?.tagName;
  if (["INPUT", "TEXTAREA", "SELECT"].includes(tag)) return;
  if (e.code === "Space") {
    e.preventDefault();
    postRemote(lastTransport === "stopped" ? "transport/play" : "transport/stop");
  } else if (e.key === "r" || e.key === "R") {
    postRemote("transport/record");
  }
});
async function postRemote(cmd) {
  try {
    const r = await fetch("/api/" + cmd, { method: "POST" });
    if (!r.ok) msg("remote: " + (await r.text()), true);
  } catch (err) { msg("remote failed: " + err, true); }
}

connect();
refresh();
renderProjects();
// ------------------------------------------------------------- projects
async function renderProjects() {
  let info;
  try { info = await (await fetch("/api/projects")).json(); } catch { return; }
  if (!info.library) return; // single-file mode: nothing to switch
  $("projcard").hidden = false;
  const box = $("projects");
  box.innerHTML = "";

  const sel = document.createElement("select");
  for (const n of info.projects) {
    const o = document.createElement("option");
    o.value = n; o.textContent = n === info.current ? `${n} ★` : n;
    if (n === info.current) o.selected = true;
    sel.append(o);
  }

  const btn = (text, cls, fn) => {
    const b = document.createElement("button");
    b.textContent = text; if (cls) b.className = cls; else b.style.padding = "4px 10px";
    b.addEventListener("click", fn);
    return b;
  };
  const postJson = async (uri, name) => {
    const r = await fetch(uri, { method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name }) });
    if (!r.ok) msg(uri + ": " + (await r.text()), true);
    return r.ok;
  };

  box.append(sel,
    btn("load", null, async () => {
      if (sel.value === info.current) return;
      if (dirty && !confirm("Switch project — unsaved edits will be lost?")) return;
      if (await postJson("/api/projects/load", sel.value)) { dirty = false; setSave();
        msg(`loaded “${sel.value}”`); refresh(); renderProjects(); }
    }),
    btn("save as…", null, async () => {
      const name = prompt("New project name:");
      if (!name) return;
      if (await postJson("/api/projects/save_as", name)) {
        msg(`saved snapshot “${name}”`); renderProjects();
      }
    }),
    btn("delete", "alt", async () => {
      if (sel.value === info.current) { msg("cannot delete the current project", true); return; }
      if (!confirm(`Delete project “${sel.value}”?`)) return;
      if (await postJson("/api/projects/delete", sel.value)) renderProjects();
    }));

  const exp = document.createElement("a");
  exp.href = `/api/projects/raw?name=${encodeURIComponent(info.current)}`;
  exp.textContent = "export ⬇"; exp.style.color = "var(--acc)";
  box.append(exp);
}

// ------------------------------------------------------------- structure
// Track CRUD (max 4) + scene renaming (8 fixed columns). Edits mutate the
// fetched ProjectFile and ride the dirty-flag Save path like everything else.
function rerenderAll() {
  renderMixer(project);
  renderMatrix();
  renderStructure();
  renderKit();
}

// GM percussion names for the kit editor (subset — anything outside gets a
// raw "Note N" entry so hand-edited values never disappear).
const GM_DRUMS = {
  35: "Acoustic Bass Drum", 36: "Bass Drum 1", 37: "Side Stick",
  38: "Acoustic Snare", 39: "Hand Clap", 40: "Electric Snare",
  41: "Low Floor Tom", 42: "Closed Hi-Hat", 43: "Muted Hi-Hat",
  44: "Pedal Hi-Hat", 45: "Low Tom", 46: "Open Hi-Hat",
  47: "Low-Mid Tom", 48: "Hi-Mid Tom", 49: "Crash Cymbal 1",
  50: "High Tom", 51: "Ride Cymbal 1", 52: "Chinese Cymbal",
  53: "Ride Bell", 54: "Tambourine", 55: "Splash Cymbal",
  56: "Cowbell", 57: "Crash Cymbal 2", 58: "Vibraslap",
  60: "Hi Bongo", 62: "Muted Conga", 63: "Open Conga", 64: "Low Conga",
  75: "Claves", 76: "Hi Wood Block", 78: "Hi Agogo", 80: "Cuica",
};
const KIT_DEFAULT = [36, 38, 37, 39, 42, 46, 47, 49];

function renderKit() {
  const box = $("drumkit");
  if (!box || !project) return;
  box.innerHTML = "";
  const kit = (project.project.drum_kit || KIT_DEFAULT).slice();
  for (let i = 0; i < 8; i++) {
    const cell = document.createElement("label");
    cell.style.fontSize = "11px";
    cell.style.display = "flex";
    cell.style.flexDirection = "column";
    cell.append("pad " + (i + 1));
    const sel = document.createElement("select");
    const names = Object.keys(GM_DRUMS).map(Number);
    if (!names.includes(kit[i])) names.push(kit[i]); // never drop a valid hand-edited value
    names.sort((a, b) => a - b);
    for (const n of names) {
      const o = document.createElement("option");
      o.value = n; o.textContent = GM_DRUMS[n] || ("Note " + n);
      sel.appendChild(o);
    }
    sel.value = kit[i];
    sel.addEventListener("change", () => {
      const cur = (project.project.drum_kit || KIT_DEFAULT).slice();
      cur[i] = +sel.value;
      project.project.drum_kit = cur;
      markDirty();
    });
    cell.append(sel);
    box.appendChild(cell);
  }
}

$("kit-reset").addEventListener("click", () => {
  project.project.drum_kit = null; // None → engine's fixed kit
  markDirty();
  renderKit();
});

function renderStructure() {
  const box = $("structure");
  box.innerHTML = "";
  const p = project?.project;
  if (!p) return;

  p.tracks.forEach((t, ti) => {
    const row = document.createElement("div");
    row.className = "mrow";

    const name = document.createElement("input");
    name.type = "text"; name.value = t.name; name.style.width = "140px";
    name.addEventListener("input", () => { t.name = name.value; markDirty(); });

    const prog = document.createElement("input");
    prog.type = "number"; prog.min = 0; prog.max = 127;
    prog.value = t.instrument.gm_program; prog.style.width = "64px";
    prog.title = "GM program";
    prog.addEventListener("input", () => {
      t.instrument.gm_program = Math.max(0, Math.min(127, +prog.value || 0));
      markDirty();
    });

    const del = document.createElement("button");
    del.className = "alt"; del.textContent = "\u2715"; del.title = "delete track";
    del.addEventListener("click", () => {
      if (!confirm(`Delete "${t.name}" and all its clips?`)) return;
      p.tracks.splice(ti, 1);
      if (sel) sel = null;
      markDirty(); rerenderAll();
    });

    row.append(name, document.createTextNode(" prog"), prog, del);
    box.append(row);
  });

  const add = document.createElement("button");
  add.textContent = "+ add track";
  add.disabled = p.tracks.length >= 4;
  add.addEventListener("click", () => {
    p.tracks.push({
      name: "Track " + (p.tracks.length + 1),
      color: [120, 180, 255],
      instrument: { soundfont: null, gm_program: 0 },
      clips: Array(p.scenes.length).fill(null),
      channel: null, gain: null, pan: null, mute: false,
      reverb: null, chorus: null,
    });
    markDirty(); rerenderAll();
  });
  box.append(add);

  const sc = document.createElement("div");
  sc.style.cssText = "display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px";
  p.scenes.forEach((s, si) => {
    const in_ = document.createElement("input");
    in_.type = "text"; in_.value = s.name; in_.title = "scene S" + (si + 1);
    in_.addEventListener("input", () => { s.name = in_.value; markDirty(); });
    sc.append(in_);
  });
  box.append(sc);
}

// ------------------------------------------------------------- clip matrix
// Matrix: rows = tracks, cols = scenes. Empty cell -> click creates a
// 1-bar pattern; filled cell -> step editor below. Edits mutate `project`
// and ride the existing dirty-flag Save (PUT) path.
let sel = null;              // {ti, si} of the open step editor
let paintPitch = 60;         // pitch stamped into newly clicked steps
const NOTE_NAMES = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
const noteName = (p) => NOTE_NAMES[p % 12] + (Math.floor(p / 12) - 1);

function renderMatrix() {
  const box = $("matrix");
  box.innerHTML = "";
  const tracks = project?.project.tracks || [];
  if (!tracks.length) { box.innerHTML = "<em>No tracks.</em>"; return; }
  const scenes = project.project.scenes || [];

  const head = document.createElement("div");
  head.className = "mxrow";
  head.append(Object.assign(document.createElement("span"), { className: "mxname" }));
  for (let s = 0; s < 8; s++) {
    const h = document.createElement("span");
    h.className = "mxhead"; h.textContent = "S" + (s + 1);
    h.dataset.si = s; h.title = scenes[s]?.name || "";
    head.append(h);
  }
  box.append(head);

  tracks.forEach((t, ti) => {
    const row = document.createElement("div");
    row.className = "mxrow";
    const nm = document.createElement("span");
    nm.className = "mxname"; nm.textContent = t.name;
    row.append(nm);
    for (let si = 0; si < 8; si++) {
      const clip = (t.clips || [])[si];
      const cell = document.createElement("div");
      cell.dataset.si = si;
      cell.className = "mxcell" + (clip ? " on" : "") +
        (sel && sel.ti === ti && sel.si === si ? " sel" : "");
      cell.textContent = clip ? clip.pattern.bars + "b" : "+";
      cell.title = clip ? `${t.name} · ${scenes[si]?.name || "S" + (si + 1)}`
                        : "create clip";
      cell.addEventListener("click", () => {
        if (!t.clips || t.clips.length < 8) t.clips = Array(8).fill(null);
        if (!clip) {
          t.clips[si] = {
            name: `${t.name} S${si + 1}`,
            pattern: { bars: 1, steps: Array(16).fill(null) },
          };
          markDirty();
        }
        sel = { ti, si };
        renderMatrix();
      });
      row.append(cell);
    }
    box.append(row);
  });

  if (sel) renderStepEditor();
}

function renderStepEditor() {
  const box = $("stepedit");
  const t = project.project.tracks[sel.ti];
  const clip = t?.clips?.[sel.si];
  if (!clip) { box.hidden = true; return; }
  box.hidden = false;
  box.innerHTML = "";

  const bar = document.createElement("div");
  bar.style.cssText = "display:flex;gap:8px;align-items:center;flex-wrap:wrap";

  const title = document.createElement("b");
  title.textContent = `${t.name} · ${project.project.scenes[sel.si]?.name || "S" + (sel.si + 1)}`;

  const pitch = document.createElement("input");
  pitch.type = "number"; pitch.min = 0; pitch.max = 127; pitch.value = paintPitch;
  pitch.style.width = "70px"; pitch.title = "paint pitch (MIDI)";
  pitch.addEventListener("input", () => { paintPitch = +pitch.value || 60; });

  const barsSel = document.createElement("select");
  for (const b of [1, 2, 4]) {
    const o = document.createElement("option");
    o.value = b; o.textContent = b + " bar" + (b > 1 ? "s" : "");
    barsSel.append(o);
  }
  barsSel.value = clip.pattern.bars;
  barsSel.addEventListener("change", () => {
    const nb = +barsSel.value;
    const steps = Array(nb * 16).fill(null);
    clip.pattern.steps.forEach((s, i) => { if (i < steps.length) steps[i] = s; });
    clip.pattern.bars = nb;
    clip.pattern.steps = steps;
    markDirty(); renderStepEditor();
  });

  const del = document.createElement("button");
  del.className = "alt"; del.textContent = "delete clip";
  del.addEventListener("click", () => {
    if (!confirm(`Delete clip "${clip.name}"?`)) return;
    t.clips[sel.si] = null;
    sel = null;
    markDirty(); renderMatrix(); box.hidden = true;
  });

  const close = document.createElement("button");
  close.className = "alt"; close.textContent = "close";
  close.addEventListener("click", () => { sel = null; box.hidden = true; renderMatrix(); });

  bar.append(title, document.createTextNode(" paint:"), pitch,
             document.createTextNode(" length:"), barsSel, del, close);
  box.append(bar);

  const grid = document.createElement("div");
  grid.className = "sgrid";
  clip.pattern.steps.forEach((s, i) => {
    const c = document.createElement("div");
    c.className = "step" + (s ? " on" : "") + (i % 4 === 0 ? " b0" : "");
    c.textContent = s ? noteName(s.pitch) : "";
    c.title = s ? `${noteName(s.pitch)} vel ${s.velocity} — click to clear`
                : `click to add ${noteName(paintPitch)}`;
    c.addEventListener("click", () => {
      clip.pattern.steps[i] = s ? null
                                 : { pitch: paintPitch, velocity: 100 };
      markDirty(); renderStepEditor();
    });
    grid.append(c);
  });
  box.append(grid);
}

$("cleartakes").addEventListener("click", async () => {
  if (!project) return;
  const n = (project.project.takes || []).length;
  if (!n || !confirm(`Delete all ${n} take(s)? This cannot be undone.`)) return;
  const body = structuredClone(project);
  body.project.takes = [];
  await putProject(body, "all takes cleared");
});

// Remote control: transport + scene chips drive the engine over HTTP —
// same event path the Oxygen keys take. State comes back via /ws.
$("remote").addEventListener("click", async (e) => {
  const b = e.target.closest("button[data-cmd]");
  if (!b) return;
  try {
    const r = await fetch("/api/" + b.dataset.cmd, { method: "POST" });
    if (!r.ok) msg("remote: " + (await r.text()), true);
  } catch (err) { msg("remote failed: " + err, true); }
});
</script>
